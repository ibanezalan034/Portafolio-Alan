    // Variables globales
    let currentMundial = null;

    function renderMundial(m) {
        const container = document.getElementById('contenedor-mundial');
        if (!m) {
            container.innerHTML = `<div class="no-results">🏆 No se encontró ningún mundial con esos criterios. Probá con otro nombre de sede, año o campeón.</div>`;
            return;
        }
        let tablaHtml = `<table class="tabla-goleadores"><thead><tr><th>Jugador</th><th>Goles</th></tr></thead><tbody>`;
        m.tablaGoleadores.forEach(g => { tablaHtml += `<tr><td>${g.nombre}</td><td>${g.goles}</td></tr>`; });
        tablaHtml += `</tbody></table>`;
        const htmlCard = `
            <div class="worldcup-card">
                <div class="card-header">
                    <h2>🏆 ${m.nombre} (Sede: ${m.sede}) | Campeón: ${m.campeon} 🏆</h2>
                    <div>Subcampeón: ${m.subcampeon}</div>
                </div>
                <div class="stats-grid">
                    <div class="stat-block">
                        <h3>🌟 Premios</h3>
                        <ul class="stat-list">
                            <li><span class="badge-stat">🏅 Mejor Selección</span> ${m.mejorSeleccion}</li>
                            <li><span class="badge-stat">🧠 DT</span> ${m.mejorDt}</li>
                            <li><span class="badge-stat">🟨 Árbitro</span> ${m.mejorArbitro}</li>
                            <li><span class="badge-stat">🧤 Arquero</span> ${m.mejorArquero}</li>
                            <li><span class="badge-stat">🛡️ Defensa</span> ${m.mejorDefensa}</li>
                            <li><span class="badge-stat">⚙️ Mediocampo</span> ${m.mejorMediocampo}</li>
                            <li><span class="badge-stat">⚡ Delantero</span> ${m.mejorDelantero}</li>
                            <li><span class="badge-stat">👟 Bota Oro</span> <strong>${m.botaOro}</strong></li>
                            <li><span class="badge-stat">🍃 Fair Play</span> ${m.fairPlay}</li>
                            <li><span class="badge-stat">⭐ Jugador Joven</span> ${m.mejorJoven}</li>
                        </ul>
                    </div>
                    <div class="stat-block">
                        <h3>🎯 Premios especiales</h3>
                        <ul class="stat-list">
                            <li><span class="badge-stat">⚽ Mejor Gol</span> ${m.mejorGol}</li>
                            <li><span class="badge-stat">🎯 Mejor Asistencia</span> ${m.mejorAsistencia}</li>
                            <li><span class="badge-stat">🧤 Mejor Atajada</span> ${m.mejorAtajada}</li>
                            <li><span class="badge-stat">🟨 Más Amarillas</span> ${m.masAmarillas}</li>
                            <li><span class="badge-stat">🟥 Más Rojas</span> ${m.masRojas}</li>
                            <li><span class="badge-stat">✅ Sin amarillas/rojas</span> ${m.sinAmarillasRojas}</li>
                            <li><span class="badge-stat">🚫 Sin Rojas</span> ${m.sinRojas}</li>
                        </ul>
                        <h3>📊 Goleadores</h3>
                        ${tablaHtml}
                    </div>
                    <div class="stat-block controversia">
                        <h3>⚠️ CONTROVERSIAS HISTÓRICAS</h3>
                        <p>${m.controversias}</p>
                    </div>
                </div>
                <div class="footer-card">
                    📅 ${m.nombre} | Bota de Oro: ${m.botaOro} | Fair Play: ${m.fairPlay} | Joven: ${m.mejorJoven}
                </div>
            </div>
        `;
        container.innerHTML = htmlCard;
        currentMundial = m;
    }

    function buildNavButtons(filteredList) {
        const nav = document.getElementById('navMundiales');
        nav.innerHTML = '';
        filteredList.sort((a,b)=>a.id-b.id).forEach(m => {
            const btn = document.createElement('button');
            btn.className = 'btn-mundial';
            // Mostrar AÑO + SEDE (ej: "1930 Uruguay")
            btn.textContent = `${m.id} ${m.sede}`;
            btn.title = `${m.nombre} - Campeón: ${m.campeon}`;
            btn.onclick = () => {
                document.querySelectorAll('.btn-mundial').forEach(b=>b.classList.remove('active'));
                btn.classList.add('active');
                renderMundial(m);
                window.scrollTo({ top: 140, behavior: 'smooth' });
            };
            nav.appendChild(btn);
        });
        // Si hay resultados y existe el mundial actual, lo marcamos activo, sino marcamos el primero
        if (filteredList.length > 0) {
            if (currentMundial && filteredList.some(m => m.id === currentMundial.id)) {
                const btnActive = Array.from(nav.children).find(btn => btn.textContent.includes(currentMundial.id.toString()));
                if (btnActive) btnActive.classList.add('active');
                else nav.children[0]?.classList.add('active');
            } else {
                nav.children[0]?.classList.add('active');
                renderMundial(filteredList[0]);
            }
        } else {
            renderMundial(null);
        }
    }

    function filterMundiales(searchTerm) {
        if (!searchTerm.trim()) {
            buildNavButtons(mundialesData);
            return;
        }
        const term = searchTerm.toLowerCase();
        const filtered = mundialesData.filter(m => 
            m.id.toString().includes(term) || 
            m.sede.toLowerCase().includes(term) || 
            m.campeon.toLowerCase().includes(term) ||
            m.nombre.toLowerCase().includes(term)
        );
        buildNavButtons(filtered);
    }

    // Inicializar buscador y eventos
    function init() {
        buildNavButtons(mundialesData);
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearSearchBtn');
        searchInput.addEventListener('input', (e) => {
            const val = e.target.value;
            filterMundiales(val);
            if (val.length > 0) clearBtn.style.display = 'block';
            else clearBtn.style.display = 'none';
        });
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            filterMundiales('');
            clearBtn.style.display = 'none';
            searchInput.focus();
        });
    }
    init();
</script>
